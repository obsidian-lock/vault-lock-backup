# Type-check and build the plugin, and test install.ps1 on Windows PowerShell 5.1.
name: ci
on:
  push:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - run: npm ci
      - run: npm run check
      - run: npm run build
  installer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - name: Test install.ps1
        shell: powershell
        run: ./scripts/test-install.ps1
